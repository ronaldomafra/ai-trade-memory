[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trade-memory"
version = "0.1.0"
description = "Paper-only crypto trading laboratory with auditable statistical memory"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "feedparser>=6,<7",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
  "textual>=1,<10",
  "argon2-cffi>=23,<26",
  "pyotp>=2.9,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.9,<1"]

[project.scripts]
poc = "poc.adapters.inbound.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/contract", "tests/tui", "tests/acceptance"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

